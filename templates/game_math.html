<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><meta name="description" content="交叉算式：填数使横向、纵向算式都成立"><title>数学思维 · 交叉算式</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='games.css') }}"></head>
<body><main class="app">
  <header class="hero"><a class="back" href="/">← 返回打卡</a><div class="eyebrow">✨ MATH CROSS PUZZLE</div><h1>🧮 数学思维 · 交叉算式</h1><p>在空格里填数，让每一道横向、纵向算式都成立。数字范围 1–<span id="top-label"></span>。</p></header>
  <div class="toolbar">
    <div class="chip-row" role="group" aria-label="数字范围"><button class="chip" data-top="20">20以内</button><button class="chip" data-top="40">40以内</button></div>
    <div class="chip-row"><button id="new-puzzle" class="chip action">🔄 换一题</button><button id="check" class="chip action">✅ 检查</button><button id="reveal" class="chip action">💡 显示答案</button></div>
  </div>
  <p class="progress" id="progress"></p>
  <p class="error" id="puzzle-error" role="alert" hidden>题目加载失败，请稍后重试。</p>
  <div id="puzzle" class="puzzle" aria-label="交叉算式网格"></div>
  <div class="footer">全部填对会有小惊喜 ✨</div>
</main>
<dialog id="win" aria-labelledby="win-title"><div class="reward-particles" aria-hidden="true"></div><div class="reward-card"><span class="reward-star" aria-hidden="true">🌟</span><h2 id="win-title">全部正确！</h2><p>交叉算式小达人就是你</p><button id="again" class="chip action">再来一题</button><button id="close-win" class="dialog-close" aria-label="关闭庆祝弹窗">×</button></div></dialog>
<script>
  const grid = document.querySelector('#puzzle'), progress = document.querySelector('#progress'), errorTip = document.querySelector('#puzzle-error'), win = document.querySelector('#win');
  let data = {{ puzzle|tojson }}, inputs = new Map(), solved = false;

  function render(puzzle){
    data = puzzle; solved = false; inputs.clear(); grid.replaceChildren();
    grid.style.gridTemplateColumns = `repeat(${puzzle.size}, 1fr)`;
    document.querySelector('#top-label').textContent = puzzle.top;
    document.querySelectorAll('.chip[data-top]').forEach(chip => chip.classList.toggle('active', Number(chip.dataset.top) === puzzle.top));
    const marks = new Map(puzzle.marks.map(m => [`${m.r},${m.c}`, m.text]));
    const numbers = new Map(puzzle.numbers.map(n => [`${n.r},${n.c}`, n]));
    for (let r = 0; r < puzzle.size; r++) for (let c = 0; c < puzzle.size; c++){
      const key = `${r},${c}`;
      if (marks.has(key)){ const cell = document.createElement('div'); cell.className = 'cell mark'; cell.textContent = marks.get(key); grid.append(cell); continue; }
      if (numbers.has(key)){
        const item = numbers.get(key);
        if (item.given){ const cell = document.createElement('div'); cell.className = 'cell given'; cell.textContent = item.answer; grid.append(cell); }
        else{
          const input = document.createElement('input');
          input.className = 'cell editable'; input.type = 'text'; input.inputMode = 'numeric'; input.maxLength = 2;
          input.setAttribute('aria-label', `第${r + 1}行第${c + 1}列`);
          input.addEventListener('input', () => { input.classList.remove('wrong'); input.value = input.value.replace(/\D/g, '').slice(0, 2); refresh(); });
          grid.append(input); inputs.set(key, input);
        }
        continue;
      }
      const cell = document.createElement('div'); cell.className = 'cell gap'; grid.append(cell);
    }
    refresh();
  }

  const valueOf = coords => { const input = inputs.get(`${coords[0]},${coords[1]}`); const n = input ? parseInt(input.value, 10) : NaN; return input && input.value !== '' && Number.isFinite(n) ? n : null; };

  function refresh(){
    let correct = 0;
    for (const eq of data.equations){
      const [a, b, c] = eq.cells.map(valueOf);
      if (a !== null && b !== null && c !== null && (eq.op === '+' ? a + b === c : a - b === c)) correct++;
    }
    const total = data.equations.length;
    progress.textContent = solved ? `答案已揭晓 · 共 ${total} 道算式` : (correct === total ? `${correct} / ${total} 全部正确！` : `正确 ${correct} / ${total} 道算式`);
    if (!solved && total && correct === total) celebrate();
  }

  document.querySelector('#check').addEventListener('click', () => {
    if (solved) return;
    for (const eq of data.equations){
      const [a, b, c] = eq.cells.map(valueOf);
      const ok = a !== null && b !== null && c !== null && (eq.op === '+' ? a + b === c : a - b === c);
      const filled = a !== null && b !== null && c !== null;
      if (filled && !ok) eq.cells.forEach(coords => inputs.get(`${coords[0]},${coords[1]}`).classList.add('wrong'));
    }
  });

  document.querySelector('#reveal').addEventListener('click', () => {
    solved = true;
    for (const item of data.numbers){
      if (item.given) continue;
      const input = inputs.get(`${item.r},${item.c}`);
      input.value = item.answer; input.disabled = true; input.classList.add('revealed');
    }
    refresh();
  });

  function celebrate(){
    const particles = win.querySelector('.reward-particles'); particles.replaceChildren();
    for (let i = 0; i < 48; i++){
      const particle = document.createElement('i'), angle = Math.random() * Math.PI * 2, distance = 140 + Math.random() * 200;
      particle.style.cssText = `--x:${Math.cos(angle) * distance}px;--y:${Math.sin(angle) * distance}px;--spin:${Math.random() * 720}deg;--delay:${Math.random() * .25}s;background:${['#ffd64a', '#ff719a', '#72dfbd', '#8e93ff', '#ffac58'][i % 5]}`;
      particles.append(particle);
    }
    win.showModal();
  }

  async function loadPuzzle(top){
    errorTip.hidden = true; win.close();
    try{
      const response = await fetch(`/api/games/math/puzzle?top=${top}`);
      if (!response.ok) throw Error();
      render(await response.json());
    }catch{ errorTip.hidden = false; }
  }

  document.querySelectorAll('.chip[data-top]').forEach(chip => chip.addEventListener('click', () => loadPuzzle(chip.dataset.top)));
  document.querySelector('#new-puzzle').addEventListener('click', () => loadPuzzle(data.top));
  document.querySelector('#again').addEventListener('click', () => loadPuzzle(data.top));
  document.querySelector('#close-win').addEventListener('click', () => win.close());
  win.addEventListener('click', event => { if (event.target === win) win.close(); });

  render(data);
</script></body></html>
