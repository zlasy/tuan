<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <title>演讲练习 · 传承长征精神</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff8ee;color:#293449;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:860px;margin:auto;padding:28px 20px 40px}a{color:#93652d;text-decoration:none;font-size:14px;font-weight:700}header{margin-bottom:24px}h1{font-size:30px;margin:20px 0 8px}header p{color:#7e8694;font-size:14px;line-height:1.8;margin:0}
    article{padding:20px;background:#fff;border:1px solid #f4ede3;border-radius:20px;box-shadow:0 7px 24px #594b3510}article p{margin:0 0 22px;line-height:1}article p:last-child{margin-bottom:0}
    .character{display:inline-flex;vertical-align:bottom;flex-direction:column;align-items:center;justify-content:end;min-width:2.6em;height:74px;margin:0 1px 8px;padding:6px 2px;border:0;border-radius:8px;background:transparent;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .pinyin{font-size:15px;line-height:24px;color:#93652d}.hanzi{font-size:26px;line-height:34px}.character[aria-pressed="true"] .pinyin{visibility:hidden}.character:hover{background:#fff4e6}.character:focus-visible,a:focus-visible{outline:3px solid #f4a47c;outline-offset:2px}
    .punctuation{display:inline-block;vertical-align:bottom;font-size:26px;line-height:34px;padding-bottom:14px}.space{white-space:pre}
    @media(max-width:480px){main{padding:22px 12px 32px}article{padding:14px 10px}.character{min-width:2.5em;margin-left:0;margin-right:0}.pinyin{font-size:14px}}
  </style>
</head>
<body><main>
  <header><a href="/">← 返回打卡</a><h1>🎤 演讲练习</h1><p>传承长征精神 · 点击汉字或拼音，隐藏这个字的拼音；再点一次恢复。</p></header>
  <article id="speech" aria-label="演讲稿"></article>
  <script>
    const paragraphs = [
      ['尊敬的老师，亲爱的同学们： 大家上午好！', 'zūn jìng de lǎo shī qīn ài de tóng xué men dà jiā shàng wǔ hǎo'],
      ['长征路上，先辈们用坚守和勇气闯过重重难关，换来了我们今天的幸福生活。长征精神从来不是遥远的历史，它就在我们身边。', 'cháng zhēng lù shàng xiān bèi men yòng jiān shǒu hé yǒng qì chuǎng guò chóng chóng nán guān huàn lái le wǒ men jīn tiān de xìng fú shēng huó cháng zhēng jīng shén cóng lái bú shì yáo yuǎn de lì shǐ tā jiù zài wǒ men shēn biān'],
      ['课堂上认真思考的专注，运动场上坚持到底的韧劲，遇到难题不放弃的钻劲，都是长征精神的小体现。作为小学生，我们不用奔赴战场，但可以做好每一件小事：遵守纪律、努力学习、友爱同学、自强自立。', 'kè táng shàng rèn zhēn sī kǎo de zhuān zhù yùn dòng chǎng shàng jiān chí dào dǐ de rèn jìn yù dào nán tí bú fàng qì de zuān jìn dōu shì cháng zhēng jīng shén de xiǎo tǐ xiàn zuò wéi xiǎo xué shēng wǒ men bú yòng bēn fù zhàn chǎng dàn kě yǐ zuò hǎo měi yí jiàn xiǎo shì zūn shǒu jì lǜ nǔ lì xué xí yǒu ài tóng xué zì qiáng zì lì'],
      ['让我们从小事做起，传承长征精神，做有担当的好少年！ 我的演讲完毕，谢谢大家！', 'ràng wǒ men cóng xiǎo shì zuò qǐ chuán chéng cháng zhēng jīng shén zuò yǒu dān dāng de hǎo shào nián wǒ de yǎn jiǎng wán bì xiè xie dà jiā']
    ];
    const speech = document.querySelector('#speech');
    const storageKey = 'speech-pinyin-hidden-v1';
    let hiddenCharacters = new Set();
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved)) hiddenCharacters = new Set(saved.filter(id => typeof id === 'string'));
    } catch {}
    for (const [paragraphIndex, [text, pronunciation]] of paragraphs.entries()) {
      const paragraph = document.createElement('p'), syllables = pronunciation.split(' ');
      let index = 0;
      for (const character of text) {
        const isHanzi = /[\u4e00-\u9fff]/.test(character);
        const element = document.createElement(isHanzi ? 'button' : 'span');
        element.className = isHanzi ? 'character' : /\s/.test(character) ? 'space' : 'punctuation';
        if (isHanzi) {
          const pinyin = document.createElement('span'), hanzi = document.createElement('span');
          pinyin.className = 'pinyin'; pinyin.textContent = syllables[index++];
          hanzi.className = 'hanzi'; hanzi.textContent = character;
          const id = `${paragraphIndex}:${index - 1}`;
          element.type = 'button'; element.setAttribute('aria-pressed', String(hiddenCharacters.has(id)));
          element.setAttribute('aria-label', character + '：隐藏或恢复拼音');
          element.append(pinyin, hanzi);
          element.addEventListener('click', () => {
            const hidden = !hiddenCharacters.has(id);
            if (hidden) hiddenCharacters.add(id); else hiddenCharacters.delete(id);
            element.setAttribute('aria-pressed', String(hidden));
            try { localStorage.setItem(storageKey, JSON.stringify([...hiddenCharacters])); } catch {}
          });
        } else element.textContent = character;
        paragraph.append(element);
      }
      speech.append(paragraph);
    }
  </script>
</main></body>
</html>
