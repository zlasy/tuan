<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ee"><meta name="description" content="英语单词闪卡：翻一翻，看看你认识几个"><title>英语单词 · 闪卡</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='games.css') }}"></head>
<body><main class="app">
  <header class="hero"><a class="back" href="/">← 返回打卡</a><div class="eyebrow">✨ WORD FLASHCARDS</div><h1>🔤 英语单词 · 闪卡</h1><p>一、二年级词汇与常见句式。先看英文猜意思，点击卡片翻面对答案。</p></header>
  <div class="toolbar">
    <div class="chip-row" role="group" aria-label="学习模式"><button id="mode-flash" class="chip active" aria-pressed="true">翻卡模式</button><button id="mode-spelling" class="chip" aria-pressed="false">拼写模式</button></div>
    <div class="chip-row word-categories" role="group" aria-label="词汇与句式分类">{% for key, label in categories %}<button class="chip" data-category="{{ key }}">{{ label }}</button>{% endfor %}</div>
    <div class="chip-row"><button id="open-mistakes" class="chip action">📒 错题本</button><button id="new-deck" class="chip action">🔄 换一批</button></div>
  </div>
  <section id="mistake-book" class="mistake-book" aria-labelledby="mistake-title" hidden>
    <h2 id="mistake-title">📒 错题本</h2>
    <p>点击「再想想」或拼写答错自动收录，掌握后可手动移出。</p>
    <div class="chip-row"><button id="review-mistakes" class="chip action">复习错题</button><button id="close-mistakes" class="chip">返回闪卡</button></div>
    <p id="mistake-empty" hidden>还没有错题，继续学习吧 ✨</p>
    <div id="mistake-list"></div>
  </section>
  <p id="save-status" role="status"></p>
  <p class="progress" id="progress"></p>
  <p class="error" id="deck-error" role="alert" hidden>卡片加载失败，请稍后重试。</p>
  <div id="scene" class="flash-scene">
    <div id="flash-card" class="flash-card" role="button" tabindex="0" aria-label="英语卡片，点击翻面">
      <div class="flash-face front"><button id="speak" class="speaker" aria-label="朗读英文">🔊</button><span id="card-emoji" class="flash-emoji"></span><span id="card-word" class="flash-word"></span><span class="flash-hint">猜猜什么意思？点击翻面</span></div>
      <div class="flash-face back"><span id="card-cn" class="flash-cn"></span><span id="card-example" class="flash-example"></span><span class="flash-hint">再点一下翻回正面</span></div>
    </div>
    <div id="flash-answers" class="answer-row"><button id="know" class="chip action big">😄 认识啦</button><button id="again" class="chip action big">🤔 再想想</button></div>
    <form id="spelling-form" class="spelling-card" hidden>
      <p id="spelling-prompt" class="flash-cn"></p>
      <label for="spelling-input">根据中文输入英文单词或句式</label>
      <input id="spelling-input" type="text" lang="en" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="spelling-feedback">
      <p id="spelling-feedback" role="status"></p>
      <button id="spelling-submit" class="chip action big" type="submit">检查拼写</button>
    </form>
  </div>
  <div class="footer">滑动标签选择主题 · 每轮 10 张，没记住的会再出现 ✨</div>
</main>
<dialog id="win" aria-labelledby="win-title"><div class="reward-particles" aria-hidden="true"></div><div class="reward-card"><span class="reward-star" aria-hidden="true">🌟</span><h2 id="win-title">全部认识！</h2><p id="win-detail">单词小达人就是你</p><button id="restart" class="chip action">再来一组</button><button id="close-win" class="dialog-close" aria-label="关闭庆祝弹窗">×</button></div></dialog>
<script>
  const card = document.querySelector('#flash-card'), progress = document.querySelector('#progress'), errorTip = document.querySelector('#deck-error'), win = document.querySelector('#win');
  let count = 0, queue = [], index = 0, known = 0, reviewing = false, busy = false, roundId, spelling = false, spellingResult = null;
  const spellingInput = document.querySelector('#spelling-input');

  function speak(text){
    try{
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US'; utterance.rate = .75;
      speechSynthesis.speak(utterance);
    }catch{}
  }

  function show(){
    if (!queue.length) return;
    const item = queue[index];
    spellingResult = null;
    card.hidden = spelling;
    document.querySelector('#flash-answers').hidden = spelling;
    document.querySelector('#spelling-form').hidden = !spelling;
    document.querySelector('#spelling-prompt').textContent = `${item.card.emoji} ${item.card.cn}`;
    spellingInput.value = '';
    spellingInput.disabled = false;
    document.querySelector('#spelling-feedback').textContent = '';
    document.querySelector('#spelling-submit').textContent = '检查拼写';
    if (spelling) spellingInput.focus();
    card.classList.remove('flipped');
    card.classList.toggle('sentence', item.card.kind === 'phrase');
    document.querySelector('#card-emoji').textContent = item.card.emoji;
    document.querySelector('#card-word').textContent = item.card.word;
    document.querySelector('#card-cn').textContent = `${item.card.emoji} ${item.card.cn}`;
    document.querySelector('#card-example').innerHTML = `${item.card.example}<small>${item.card.example_cn}</small>`;
    refresh();
  }

  function refresh(){
    progress.textContent = (reviewing ? '错题复习 · ' : '') + (queue.length ? `还剩 ${queue.length} 张 · 已${spelling ? '拼对' : '认识'} ${known} 张` : '全部完成啦！');
  }

  function next(){
    if (!queue.length){ winWin(); return; }
    if (index >= queue.length) index = 0;
    show();
  }

  function winWin(){
    refresh();
    document.querySelector('#scene').hidden = true;
    document.querySelector('#win-title').textContent = spelling ? '全部拼对！' : '全部认识！';
    document.querySelector('#win-detail').textContent = `本轮${spelling ? '拼对' : '认识'} ${known} 张英语卡片，太棒啦`;
    const particles = win.querySelector('.reward-particles'); particles.replaceChildren();
    for (let i = 0; i < 48; i++){
      const particle = document.createElement('i'), angle = Math.random() * Math.PI * 2, distance = 140 + Math.random() * 200;
      particle.style.cssText = `--x:${Math.cos(angle) * distance}px;--y:${Math.sin(angle) * distance}px;--spin:${Math.random() * 720}deg;--delay:${Math.random() * .25}s;background:${['#ffd64a', '#ff719a', '#72dfbd', '#8e93ff', '#ffac58'][i % 5]}`;
      particles.append(particle);
    }
    win.showModal();
  }

  const flip = () => { if (!queue.length || busy || spelling) return; card.classList.toggle('flipped'); if (card.classList.contains('flipped')) speak(queue[index].card.word); };
  card.addEventListener('click', flip);
  card.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' '){ event.preventDefault(); flip(); } });
  document.querySelector('#speak').addEventListener('click', event => { event.stopPropagation(); if (queue.length) speak(queue[index].card.word); });

  document.querySelector('#know').addEventListener('click', () => run(async () => {
    if (!queue.length) return;
    await saveAnswer(true);
    queue.splice(index, 1); known++;
    if (!queue.length) winWin(); else next();
  }));
  document.querySelector('#again').addEventListener('click', () => run(async () => {
    if (!queue.length) return;
    await saveAnswer(false);
    document.querySelector('#save-status').textContent = '已记入错题本';
    const item = queue.splice(index, 1)[0];
    queue.splice(Math.min(index + 3, queue.length), 0, item);
    next();
  }));

  async function saveAnswer(correct){
    const item = queue[index];
    const response = await fetch('/api/games/words/answer', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({word: item.card.word, correct, round_id: roundId, attempt: item.attempt + 1})
    });
    if (!response.ok) throw Error();
    await response.json();
    item.attempt++;
  }

  document.querySelector('#spelling-form').addEventListener('submit', event => {
    event.preventDefault();
    return run(async () => {
      if (!queue.length || !spelling) return;
      if (spellingResult !== null){
        const item = queue.splice(index, 1)[0];
        if (spellingResult) known++;
        else queue.splice(Math.min(index + 3, queue.length), 0, item);
        next();
        return;
      }
      const normalize = value => value.trim().toLowerCase().replace(/\s+/g, ' ');
      const answer = normalize(spellingInput.value);
      if (!answer){
        document.querySelector('#spelling-feedback').textContent = '请先输入英文。';
        spellingInput.focus();
        return;
      }
      const correct = answer === normalize(queue[index].card.word);
      await saveAnswer(correct);
      spellingResult = correct;
      spellingInput.disabled = true;
      document.querySelector('#spelling-feedback').textContent = correct ? '拼对了！' : `正确拼写：${queue[index].card.word}。已记入错题本，稍后再练。`;
      document.querySelector('#spelling-submit').textContent = '下一题';
    });
  });

  async function mistakeRequest(method = 'GET', word){
    const response = await fetch('/api/games/words/mistakes', {
      method, headers: {'Content-Type': 'application/json'},
      ...(word ? {body: JSON.stringify({word})} : {})
    });
    if (!response.ok) throw Error();
    return response.json();
  }

  async function run(action){
    if (busy) return;
    busy = true;
    const buttons = [...document.querySelectorAll('main button')];
    buttons.forEach(button => button.disabled = true);
    errorTip.hidden = true;
    document.querySelector('#save-status').textContent = '';
    try{ await action(); }
    catch{ errorTip.textContent = '操作失败，请重试；当前卡片和错题记录未在页面中移除。'; errorTip.hidden = false; }
    finally{ busy = false; buttons.forEach(button => button.disabled = false); }
  }

  function showBook(visible){
    document.querySelector('#mistake-book').hidden = !visible;
    document.querySelector('#scene').hidden = visible || !queue.length;
    progress.hidden = visible;
  }

  async function openBook(){
    const {cards} = await mistakeRequest();
    const list = document.querySelector('#mistake-list');
    list.replaceChildren();
    document.querySelector('#mistake-empty').hidden = cards.length > 0;
    for (const item of cards){
      const row = document.createElement('article');
      for (const [tag, text] of [
        ['h3', `${item.emoji} ${item.word}`],
        ['p', item.cn], ['p', `${item.example} — ${item.example_cn}`],
        ['small', `${item.kind === 'phrase' ? '句型' : '单词'} · 答错 ${item.mistakes} 次 · 最近 ${new Date(item.last_wrong).toLocaleDateString('zh-CN')}`]
      ]){
        const element = document.createElement(tag); element.textContent = text; row.append(element);
      }
      const remove = document.createElement('button');
      remove.className = 'chip'; remove.textContent = '已掌握，移出';
      remove.setAttribute('aria-label', `已掌握 ${item.word}，移出错题本`);
      remove.addEventListener('click', () => run(async () => {
        await mistakeRequest('DELETE', item.word);
        await openBook();
      }));
      row.append(remove); list.append(row);
    }
    showBook(true);
  }

  document.querySelector('#open-mistakes').addEventListener('click', () => run(openBook));
  document.querySelector('#close-mistakes').addEventListener('click', () => showBook(false));
  async function reviewMistakes(){
    const {cards} = await mistakeRequest();
    if (!cards.length){ await openBook(); return; }
    start({category: 'mistakes', count: cards.length, cards});
  }
  document.querySelector('#review-mistakes').addEventListener('click', () => run(reviewMistakes));

  function start(deck){
    win.close(); errorTip.hidden = true;
    reviewing = deck.category === 'mistakes';
    document.querySelector('.footer').textContent = reviewing ? '复习错题本全部卡片 · 掌握后可在错题本手动移出 ✨' : '滑动标签选择主题 · 每轮 10 张，没记住的会再出现 ✨';
    showBook(false);
    document.querySelector('#scene').hidden = false;
    count = deck.count; known = 0; index = 0;
    roundId = Array.from(crypto.getRandomValues(new Uint32Array(4)), n => n.toString(16).padStart(8, '0')).join('');
    queue = deck.cards.map(card => ({card, attempt: 0}));
    document.querySelectorAll('.chip[data-category]').forEach(chip => chip.classList.toggle('active', chip.dataset.category === deck.category));
    show();
  }

  async function loadDeck(category, mode = spelling){
    return run(async () => {
      win.close();
      if (category === 'mistakes'){ await reviewMistakes(); return; }
      const response = await fetch('/api/games/words/deck?category=' + encodeURIComponent(category || 'all'));
      if (!response.ok) throw Error();
      const deck = await response.json();
      spelling = mode;
      for (const [id, active] of [['#mode-flash', !spelling], ['#mode-spelling', spelling]]){
        document.querySelector(id).classList.toggle('active', active);
        document.querySelector(id).setAttribute('aria-pressed', String(active));
      }
      document.querySelector('.hero p').textContent = spelling ? '看中文，输入对应的英文单词或句式（句式中的空缺用 ... 表示）。大小写和首尾空格不影响判分。' : '一、二年级词汇与常见句式。先看英文猜意思，点击卡片翻面对答案。';
      start(deck);
    });
  }

  for (const [id, mode] of [['#mode-flash', false], ['#mode-spelling', true]]){
    document.querySelector(id).addEventListener('click', () => {
      if (spelling === mode) return;
      const category = currentCategory();
      return loadDeck(category === 'mistakes' ? 'all' : category, mode);
    });
  }

  document.querySelectorAll('.chip[data-category]').forEach(chip => chip.addEventListener('click', () => loadDeck(chip.dataset.category)));
  document.querySelector('#new-deck').addEventListener('click', () => loadDeck(currentCategory()));
  document.querySelector('#restart').addEventListener('click', () => loadDeck(currentCategory()));
  document.querySelector('#close-win').addEventListener('click', () => win.close());
  win.addEventListener('click', event => { if (event.target === win) win.close(); });

  const currentCategory = () => reviewing ? 'mistakes' : document.querySelector('.chip[data-category].active')?.dataset.category || 'all';

  start({{ deck|tojson }});
</script></body></html>
